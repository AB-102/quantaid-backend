name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token by default; publish-image asks for packages: write itself
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    # Throwaway MongoDB for the test run; tests never touch a shared database
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - name: Run tests
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/quantaid-test
          JWT_SECRET_KEY: test-jwt-secret-for-ci
          OPENAI_API_KEY: sk-fake-key-for-ci
          ADMIN_EMAILS: testadmin@test.com
        run: uv run pytest tests/ -v

  # Each staging environment stores its own Render service's deploy hook as RENDER_DEPLOY_HOOK_URL.
  # ref= makes Render deploy the exact commit that passed CI, not whatever is newest on main.
  # Render only routes traffic to a deploy once its /health check passes, so the job then waits until /health
  # reports this commit with the database connected. A failed deploy never does, and the job times out.
  # The timeout covers Render's build plus its own 15-minute health-check window.
  # concurrency runs one deploy at a time, so Render never skips this commit for a newer queued one.
  # --max-time 90 covers a sleeping free-tier service waking up; until then, jq fails on the error page and the loop retries.
  deploy-staging-public:
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging-public
    concurrency: staging-public
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
      - name: Wait for the deploy to go live
        run: |
          until curl -sS --max-time 90 https://quantaid-api-staging-public.onrender.com/health \
              | jq -e '.commit == "${{ github.sha }}" and .database == "connected"'; do
            sleep 15
          done

  deploy-staging-rice:
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging-rice
    concurrency: staging-rice
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
      - name: Wait for the deploy to go live
        run: |
          until curl -sS --max-time 90 https://quantaid-api-staging-rice.onrender.com/health \
              | jq -e '.commit == "${{ github.sha }}" and .database == "connected"'; do
            sleep 15
          done

  # Pushes the image the Docker-route selfhost pulls (quantaid-infra/selfhost/docker).
  # Needs the staging deploys, so production only gets what staging already got.
  publish-image:
    needs: [deploy-staging-public, deploy-staging-rice]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ab-102/quantaid-backend
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
