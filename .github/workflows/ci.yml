name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    # Throwaway MongoDB for the test run; tests never touch a shared database
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - name: Run tests
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/quantaid-test
          JWT_SECRET_KEY: test-jwt-secret-for-ci
          OPENAI_API_KEY: sk-fake-key-for-ci
          ADMIN_EMAILS: testadmin@test.com
        run: uv run pytest tests/ -v

  deploy:
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
