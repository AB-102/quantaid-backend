name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's PRs. GitHub merges each one only after the checks that main's
# ruleset requires have passed.
# The merge uses the quantaid-automerge GitHub App's token, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN
# starts no push workflows, so main would skip its staging deploys and image, and GITHUB_TOKEN can't merge
# a PR that changes .github/workflows. Dependabot PRs only see Dependabot secrets, so the App's ID and key live there.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Merge once the required checks pass
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
