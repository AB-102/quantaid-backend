[project]
name = "quantaid-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=2.30.0",
    "PyJWT>=2.8.0",
    "pymongo>=4.18.2",
    "python-dotenv>=0.20.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.0",
    "ty>=0.0.26",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"data/default_dashboard_config.py" = ["E501"]  # long description strings in course data
"data/default_lessons.py" = ["E501"]  # long strings in lesson/quiz seed data

[tool.ty.environment]
python-version = "3.11"
